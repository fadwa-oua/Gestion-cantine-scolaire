<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Cantine Scolaire{% endblock %}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-image: url("{{ url_for('static', filename='background.jpeg') }}");
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            background-attachment: fixed;
            min-height: 100vh;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.3);
            z-index: -1;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Messages Flash */
        .flash-messages {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            max-width: 400px;
        }

        .alert {
            padding: 15px 25px;
            margin-bottom: 10px;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            animation: slideIn 0.3s ease-out;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
        }

        .alert-success {
            background: rgba(76, 175, 80, 0.95);
            color: white;
            border: 2px solid rgba(76, 175, 80, 0.3);
        }

        .alert-error {
            background: rgba(244, 67, 54, 0.95);
            color: white;
            border: 2px solid rgba(244, 67, 54, 0.3);
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* Page de Login/Inscription */
        .login-page {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-box {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
            width: 100%;
            max-width: 450px;
            border: 2px solid rgba(255, 255, 255, 0.5);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-icon {
            width: 80px;
            height: 80px;
            background: #c96a1a;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: white;
            margin-bottom: 15px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
        }

        h2 {
            color: #333;
            margin-bottom: 20px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
            font-family: inherit;
            background: rgba(255, 255, 255, 0.9);
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #c96a1a;
            background: rgba(255, 255, 255, 1);
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        .btn-primary {
            background: linear-gradient(135deg, #db7a2a 0%, #c96a1a 100%);
            color: white;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #c96a1a 0%, #b85f10 100%);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(201, 106, 26, 0.4);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.25);
            color: black;
            border: 2px solid rgba(255, 255, 255, 0.5);
            margin-top: 10px;
            text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.7);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.35);
            transform: translateY(-2px);
        }

        .btn-danger {
            background: #f44336;
            color: white;
        }

        .btn-danger:hover {
            background: #da190b;
        }

        .link-button {
            text-align: center;
            margin-top: 20px;
        }

        .link-button a {
            color: #c96a1a;
            text-decoration: none;
            font-weight: 500;
        }

        .link-button a:hover {
            text-decoration: underline;
        }

        /* Navbar */
        .navbar {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            padding: 15px 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.2);
        }

        .navbar-brand {
            font-size: 24px;
            font-weight: bold;
            color: #ffffff;
            text-decoration: none;
            text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.7);
        }

        .navbar-user {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .navbar-user span {
            color: #ffffff;
            font-weight: 600;
            text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.7);
        }

        .navbar-user .btn {
            width: auto;
            padding: 8px 20px;
        }

        /* Dashboard */
        .dashboard-content {
            background: transparent;
            border-radius: 15px;
            padding: 30px;
            min-height: 500px;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .menu-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 12px;
            padding: 20px;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        .menu-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
        }

        .menu-card h3 {
            color: #333;
        }

        .menu-card p {
            color: #555;
        }

        .price {
            color: #db7a2a;
            font-size: 24px;
            font-weight: bold;
        }

        .panier {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 12px;
            padding: 20px;
            margin-top: 30px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        .panier h3 {
            color: #333;
        }

        .panier-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
            background: rgba(0, 0, 0, 0.05);
            margin-bottom: 10px;
            border-radius: 8px;
        }

        .panier-item:last-child {
            border-bottom: none;
        }

        .panier-item strong {
            color: #333;
        }

        .panier-item p {
            color: #555;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .tab-nav {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.3);
        }

        .tab-nav a {
            padding: 12px 24px;
            text-decoration: none;
            color: #ffffff;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
            text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.7);
        }

        .tab-nav a:hover {
            color: #ffd700;
        }

        .tab-nav a.active {
            color: #ffd700;
            border-bottom-color: #ffd700;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 8px;
            overflow: hidden;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background: rgba(201, 106, 26, 0.1);
            font-weight: 600;
            color: #333;
        }

        td {
            color: #555;
        }

        .badge {
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 14px;
            font-weight: 500;
        }

        .badge-warning {
            background: #ffc107;
            color: #000;
        }

        .badge-success {
            background: #c96a1a;
            color: white;
        }

        .badge-danger {
            background: #f44336;
            color: white;
        }

        .alert-box {
            background: rgba(255, 255, 255, 0.9);
            border-left: 4px solid #ffc107;
            padding: 15px;
            margin: 20px 0;
            border-radius: 5px;
            color: #333;
        }

        .badge-display {
            background: linear-gradient(135deg, #db7a2a 0%, #c96a1a 100%);
            color: white;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            margin: 20px 0;
            box-shadow: 0 10px 30px rgba(219, 122, 42, 0.4);
        }

        .badge-number {
            font-size: 48px;
            font-weight: bold;
            letter-spacing: 3px;
            margin: 20px 0;
            text-shadow: 3px 3px 10px rgba(0, 0, 0, 0.5);
        }

        @media (max-width: 768px) {
            .grid-2 {
                grid-template-columns: 1fr;
            }
            
            .menu-grid {
                grid-template-columns: 1fr;
            }

            .navbar {
                flex-direction: column;
                gap: 15px;
            }

            .login-box {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <!-- Messages Flash -->
    <div class="flash-messages">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} flash-message">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}
    </div>

    {% block content %}{% endblock %}

    <script>
        // Faire disparaître tous les messages flash après 3 secondes
        setTimeout(function() {
            var flashMessages = document.querySelectorAll('.flash-message');
            flashMessages.forEach(function(message) {
                // Ajouter une animation de fondu
                message.style.transition = 'opacity 0.5s';
                message.style.opacity = '0';
                
                // Supprimer complètement l'élément après l'animation
                setTimeout(function() {
                    message.remove();
                }, 500);
            });
        }, 2000); // 3000 millisecondes = 3 secondes
    </script>
</body>
</html>
