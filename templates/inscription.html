{% extends "base.html" %}
{% block title %}Inscription - Cantine Scolaire{% endblock %}
{% block content %}
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    .inscription-page {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background-image: url("{{ url_for('static', filename='inscription-bg.jpeg') }}");
        background-position: center;
        background-repeat: no-repeat;
        background-size: cover;
        background-attachment: fixed;
        padding: 40px 20px;
        position: relative;
    }

    .inscription-page::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.3);
        z-index: 0;
    }

    .inscription-box {
        position: relative;
        z-index: 1;
        background: transparent;
        backdrop-filter: none;
        border-radius: 30px;
        padding: 50px 40px;
        box-shadow: none;
        max-width: 900px;
        width: 100%;
        animation: slideUp 0.6s ease-out;
        border: none;
    }

    @keyframes slideUp {
        from {
            opacity: 0;
            transform: translateY(30px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    h1 {
        text-align: center;
        color: #ffffff;
        margin-bottom: 30px;
        font-size: 36px;
        font-weight: 700;
        text-shadow: 3px 3px 10px rgba(0, 0, 0, 0.8);
    }

    h3 {
        color: #ffffff;
        margin-bottom: 15px;
        border-bottom: 2px solid #db7a2a;
        padding-bottom: 10px;
        font-size: 20px;
        font-weight: 600;
        text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.7);
    }

    .grid-2 {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 40px;
        margin-top: 30px;
    }

    .form-group {
        margin-bottom: 20px;
    }

    .form-group label {
        display: block;
        margin-bottom: 8px;
        color: #ffffff;
        font-weight: 600;
        font-size: 15px;
        text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.7);
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
        width: 100%;
        padding: 14px 18px;
        border: 2px solid rgba(255, 255, 255, 0.5);
        border-radius: 12px;
        font-size: 16px;
        transition: all 0.3s ease;
        background: rgba(255, 255, 255, 0.25);
        color: #333;
        font-family: inherit;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
        outline: none;
        border-color: rgba(255, 255, 255, 0.8);
        box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.2);
        background: rgba(255, 255, 255, 0.35);
    }

    .form-group input::placeholder,
    .form-group textarea::placeholder {
        color: rgba(0, 0, 0, 0.5);
    }

    .form-group select {
        cursor: pointer;
    }

    .button-container {
        display: flex;
        justify-content: center;
        gap: 15px;
        margin-top: 40px;
        width: 100%;
    }

    .btn {
        padding: 16px 40px;
        border: none;
        border-radius: 12px;
        font-size: 18px;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.3s ease;
        text-decoration: none;
        display: inline-block;
        text-align: center;
    }

    .btn-primary {
        background: linear-gradient(135deg, #db7a2a 0%, #c96a1a 100%);
        color: white;
        border: 3px solid rgba(255, 255, 255, 0.3);
        box-shadow: 0 5px 15px rgba(219, 122, 42, 0.3);
    }

    .btn-primary:hover {
        background: linear-gradient(135deg, #c96a1a 0%, #b85f10 100%);
        transform: translateY(-3px);
        box-shadow: 0 8px 20px rgba(219, 122, 42, 0.5);
    }

    .btn-secondary {
        background: rgba(255, 255, 255, 0.25);
        color: white;
        border: 2px solid rgba(255, 255, 255, 0.5);
        text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.7);
    }

    .btn-secondary:hover {
        background: rgba(255, 255, 255, 0.35);
        transform: translateY(-2px);
    }

    .btn:active {
        transform: translateY(-1px);
    }

    @media screen and (max-width: 768px) {
        .grid-2 {
            grid-template-columns: 1fr;
            gap: 20px;
        }

        .inscription-box {
            padding: 30px 20px;
        }

        h1 {
            font-size: 28px;
        }

        .button-container {
            flex-direction: column;
            gap: 10px;
        }

        .btn {
            width: 100%;
        }
    }
</style>

<div class="inscription-page">
    <div class="inscription-box">
        <h1>Inscription Élève</h1>
        <form method="POST" action="{{ url_for('inscription_post') }}">
            <div class="grid-2">
                <div>
                    <h3>Informations Élève</h3>
                    <div class="form-group">
                        <label>Nom *</label>
                        <input type="text" name="nom_eleve" required>
                    </div>
                    <div class="form-group">
                        <label>Prénom *</label>
                        <input type="text" name="prenom_eleve" required>
                    </div>
                    <div class="form-group">
                        <label>Date de Naissance *</label>
                        <input type="date" name="date_naissance" required>
                    </div>
                    <div class="form-group">
                        <label>Classe *</label>
                        <input type="text" name="classe" placeholder="Ex: 5ème A" required>
                    </div>
                    <div class="form-group">
                        <label>Allergies</label>
                        <input type="text" name="allergie" placeholder="Ex: Arachides, Lactose, Gluten...">
                    </div>
                    <div class="form-group">
                        <label>Régime Alimentaire</label>
                        <select name="regime">
                            <option value="">Aucun</option>
                            <option value="Végétarien">Végétarien</option>
                            <option value="Végétalien">Végétalien (Vegan)</option>
                            <option value="Sans gluten">Sans gluten</option>
                            <option value="Sans lactose">Sans lactose</option>
                            <option value="Halal">Halal</option>
                            <option value="Casher">Casher</option>
                            <option value="Diabétique">Diabétique</option>
                            <option value="Hypertendu">Hypertendu (faible en sel)</option>
                            <option value="Faible en cholestérol">Faible en cholestérol</option>
                            <option value="Sans fruits à coque">Sans fruits à coque</option>
                            <option value="Pescétarien">Pescétarien (poisson uniquement)</option>
                        </select>
                    </div>
                </div>
                <div>
                    <h3>Informations Tuteur</h3>
                    <div class="form-group">
                        <label>CIN Tuteur *</label>
                        <input type="text" name="id_tuteur" required>
                    </div>
                    <div class="form-group">
                        <label>Nom *</label>
                        <input type="text" name="nom_tuteur" required>
                    </div>
                    <div class="form-group">
                        <label>Prénom *</label>
                        <input type="text" name="prenom_tuteur" required>
                    </div>
                    <div class="form-group">
                        <label>Téléphone * (10 chiffres)</label>
                        <input type="tel" name="tel_tuteur" maxlength="10" placeholder="0612345678" pattern="[0-9]{10}" required>
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" name="email_tuteur">
                    </div>
                    <div class="form-group">
                        <label>Adresse</label>
                        <textarea name="adresse_tuteur" rows="2"></textarea>
                    </div>
                    <div class="form-group">
                        <label>Type de Tuteur</label>
                        <select name="type_tuteur" required>
                            <option value="père">Père</option>
                            <option value="mère">Mère</option>
                            <option value="oncle">Oncle</option>
                            <option value="tante">Tante</option>
                            <option value="responsable légal">Responsable Légal</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="button-container">
                <button type="submit" class="btn btn-primary">S'inscrire</button>
                <a href="{{ url_for('index') }}" class="btn btn-secondary">Retour</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
