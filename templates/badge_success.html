{% extends "base.html" %}
{% block title %}Inscription Réussie{% endblock %}
{% block content %}
<div class="login-page">
    <div class="login-box">
        <h2 style="text-align: center; margin-bottom: 20px;"> Inscription Réussie !</h2>
        <div class="badge-display">
            <p>Votre Numéro de Badge</p>
            <div class="badge-number">{{ badge_num }}</div>
        </div>
        <div class="alert-box">
            <strong> Important :</strong> Notez bien ce numéro de badge. Vous en aurez besoin pour vous connecter.
        </div>
        <a href="{{ url_for('index') }}" class="btn btn-primary">Aller à la Connexion</a>
    </div>
</div>
{% endblock %}
